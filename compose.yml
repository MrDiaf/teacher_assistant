services:
  database:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teacher_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-teacher_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teacher_assistant_dev}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - database-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-teacher_assistant}:${POSTGRES_PASSWORD:-teacher_assistant_dev}@database:5432/${POSTGRES_DB:-teacher_assistant}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_AUTH_HOME: ${CODEX_AUTH_HOME:-/var/lib/teacher-assistant/codex}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-sol}
      AI_ALLOWED_MODELS: ${AI_ALLOWED_MODELS:-gpt-5.6-sol,gpt-5.6-terra,gpt-5.6-luna}
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS:-90}
      ASSISTANT_PROPOSAL_TTL_MINUTES: ${ASSISTANT_PROPOSAL_TTL_MINUTES:-30}
      COURSE_STORAGE_ROOT: ${COURSE_STORAGE_ROOT:-/data/course_content}
      COURSE_MAX_UPLOAD_MB: ${COURSE_MAX_UPLOAD_MB:-25}
      INTEGRATION_CREDENTIAL_ROOT: ${INTEGRATION_CREDENTIAL_ROOT:-/var/lib/teacher-assistant/integrations}
      MAIL_STORAGE_ROOT: ${MAIL_STORAGE_ROOT:-/data/mail_attachments}
      MAIL_SYNC_INTERVAL_SECONDS: ${MAIL_SYNC_INTERVAL_SECONDS:-300}
      MAIL_TIMEOUT_SECONDS: ${MAIL_TIMEOUT_SECONDS:-15}
      MAIL_MAX_MESSAGE_MB: ${MAIL_MAX_MESSAGE_MB:-15}
      MAIL_MAX_ATTACHMENT_MB: ${MAIL_MAX_ATTACHMENT_MB:-10}
      MAIL_MAX_TOTAL_STORAGE_MB: ${MAIL_MAX_TOTAL_STORAGE_MB:-2048}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - codex-auth-data:${CODEX_AUTH_HOME:-/var/lib/teacher-assistant/codex}
      - integration-credential-data:${INTEGRATION_CREDENTIAL_ROOT:-/var/lib/teacher-assistant/integrations}
      - ${COURSE_DATA_DIR:-./data/course_content}:${COURSE_STORAGE_ROOT:-/data/course_content}
      - ${MAIL_DATA_DIR:-./data/mail_attachments}:${MAIL_STORAGE_ROOT:-/data/mail_attachments}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  codex-auth-data:
  integration-credential-data:
  database-data:
