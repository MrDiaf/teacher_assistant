services:
  database:
    environment:
      POSTGRES_DB: teacher_assistant_test
      POSTGRES_USER: teacher_assistant_test
      POSTGRES_PASSWORD: teacher_assistant_test
    volumes:
      - test-database-data:/var/lib/postgresql/data

  backend:
    environment:
      DATABASE_URL: postgresql+asyncpg://teacher_assistant_test:teacher_assistant_test@database:5432/teacher_assistant_test
      LOG_LEVEL: warning
      TESTING: "true"
      INTEGRATION_CREDENTIAL_ROOT: /data/test_integration_credentials
      MAIL_STORAGE_ROOT: /data/test_mail_attachments
      DOCUMENT_STORAGE_ROOT: /data/test_document_projects
    ports: []
    volumes:
      - test-course-content:/data/course_content
      - test-integration-credentials:/data/test_integration_credentials
      - test-mail-attachments:/data/test_mail_attachments
      - test-document-projects:/data/test_document_projects
    restart: "no"

  frontend:
    ports: []
    restart: "no"

volumes:
  test-course-content:
  test-integration-credentials:
  test-mail-attachments:
  test-document-projects:
  test-database-data:
